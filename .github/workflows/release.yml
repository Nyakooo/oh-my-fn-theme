name: Release extension
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches extension version
        run: node -e 'const m = require("./manifest.json"); if (process.env.GITHUB_REF_NAME !== `v${m.version}`) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
