<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-name" content="fnOS">
    <meta name="theme-color" content="#182633">
    <title>fnOS · 插件主题预览</title>
    <link rel="icon" href="assets/icon.svg">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="preview.css">
  </head>
  <body>
    <label class="preview-theme-picker">主题预览
      <select id="preview-theme" aria-label="选择预览主题">
        <option value="minimal">极简</option>
        <option value="moonlit">月夜居所</option>
      </select>
    </label>
    <main class="login-form">
      <section class="demo-native-panel" id="fnos-login-panel" aria-label="模拟 fnOS 原生登录面板">
        <img src="assets/icon.svg" alt="fnOS">
        <p class="mt-5 select-none">fnOS</p>
        <form class="demo-fields" id="demo-login" autocomplete="on">
          <label for="demo-account">账户</label>
          <div class="semi-input-wrapper"><input class="semi-input" id="demo-account" name="username" autocomplete="username" placeholder="输入账户名称" required></div>
          <label for="demo-password">密码</label>
          <div class="semi-input-wrapper"><input class="semi-input" id="demo-password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required></div>
          <label class="demo-remember"><input type="checkbox" name="remember"> 保持登录</label>
          <button type="submit">登录 fnOS</button>
          <p class="demo-status" id="demo-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <p class="preview-note">插件主题预览 · 登录表单为模拟内容，不会连接或登录 NAS</p>
    <script src="preview.js"></script>
    <script src="content.js"></script>
  </body>
</html>
